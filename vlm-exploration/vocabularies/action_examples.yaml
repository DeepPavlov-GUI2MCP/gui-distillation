version: "1.0"
domain: "gnome_calculator_basic"
description: >
  ActionModel examples: (instruction + bbox) -> action_type + parameters.

examples:
  - instruction: "нажми 5"
    bbox: [0.35, 0.50, 0.40, 0.55]
    output:
      action_type: "click"
      parameters: {button: "left", clicks: 1}

  - instruction: "нажми плюс"
    bbox: [0.70, 0.50, 0.78, 0.58]
    output:
      action_type: "click"
      parameters: {button: "left", clicks: 1}

  - instruction: "посчитай"
    bbox: [0.80, 0.80, 0.92, 0.92]
    output:
      action_type: "click"
      parameters: {button: "left", clicks: 1}

  - instruction: "наведи на кнопку 7"
    bbox: [0.20, 0.50, 0.30, 0.60]
    output:
      action_type: "hover"
      parameters: {}
