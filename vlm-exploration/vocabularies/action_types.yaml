version: "1.0"
domain: "gui_generic_x11"
source: "docs/phase_0/skill_formalization.md"
description: >
  Canonical action types vocabulary for ActionModel (Skill B).
  For GNOME Calculator Basic mode, 'click' is expected in most cases.

action_types:
  click:
    summary: "Single mouse click."
    params:
      button:
        type: "string"
        required: true
        enum: ["left", "right", "middle"]
        default: "left"
      clicks:
        type: "integer"
        required: true
        constraints: ">= 1"
        default: 1

  double_click:
    summary: "Double mouse click."
    params:
      button:
        type: "string"
        required: true
        enum: ["left"]
        default: "left"

  right_click:
    summary: "Right mouse click."
    params: {}

  hover:
    summary: "Move cursor over target element (no click)."
    params: {}
