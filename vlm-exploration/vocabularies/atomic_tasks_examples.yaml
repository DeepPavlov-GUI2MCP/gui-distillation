version: "1.0"
domain: "gnome_calculator_basic"
description: >
  High-level instruction -> canonical atomic task plan examples for SimplifierTask.

examples:
  - instruction: "5 + 3"
    plan:
      - {task: "enter_digit", params: {digit: 5}}
      - {task: "operation", params: {op: "+"}}
      - {task: "enter_digit", params: {digit: 3}}
      - {task: "compute", params: {}}

  - instruction: "корень из 16"
    plan:
      - {task: "enter_number", params: {value: 16}}
      - {task: "unary", params: {op: "sqrt"}}

  - instruction: "очисти и введи 3.14"
    plan:
      - {task: "clear", params: {}}
      - {task: "enter_number", params: {value: 3.14}}

  - instruction: "посчитай 2.5 * 4"
    plan:
      - {task: "enter_number", params: {value: 2.5}}
      - {task: "operation", params: {op: "*"}}
      - {task: "enter_number", params: {value: 4}}
      - {task: "compute", params: {}}

  - instruction: "посчитай 2 + 2 * 3"
    plan:
      - {task: "enter_number", params: {value: 2}}
      - {task: "operation", params: {op: "+"}}
      - {task: "enter_number", params: {value: 2}}
      - {task: "operation", params: {op: "*"}}
      - {task: "enter_number", params: {value: 3}}
      - {task: "compute", params: {}}
